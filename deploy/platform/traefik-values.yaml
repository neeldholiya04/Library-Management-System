service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false
resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
