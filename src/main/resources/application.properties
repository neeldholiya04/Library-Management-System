spring.application.name=library-app

# Database: values come from environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:library_db}
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema; Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate

# Actuator: health probes, info, Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Version info shown at /actuator/info (set by the container in Phase 2)
management.info.env.enabled=true
info.app.version=${APP_VERSION:local}
info.app.git-sha=${GIT_SHA:local}