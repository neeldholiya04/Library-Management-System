apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "library.labels" . | nindent 4 }}
    {{- include "library.appSelector" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "library.appSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: management
      port: 8081
      targetPort: management