apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "library.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Release.Name }}-mysql
  DB_PORT: "3306"
  DB_NAME: {{ .Values.db.name | quote }}
  DB_USERNAME: {{ .Values.db.username | quote }}
  MANAGEMENT_SERVER_PORT: "8081"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
  MANAGEMENT_TRACING_ENABLED: {{ .Values.tracing.enabled | quote }}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: {{ .Values.tracing.samplingProbability | quote }}
  MANAGEMENT_OTLP_TRACING_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}