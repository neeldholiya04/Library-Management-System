image:
  repository: ghcr.io/neeldholiya04/library-app
  tag: ""    
  pullPolicy: IfNotPresent

replicaCount: 2

jvmOptions: "-XX:ActiveProcessorCount=2"

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 640Mi

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  host: library.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

db:
  name: library_db
  username: library
  existingSecret: library-db

mysql:
  image: mysql:8.4
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 640Mi

networkPolicy:
  enabled: true
  ingressNamespace: traefik
  monitoringNamespace: monitoring

monitoring:
  enabled: false

tracing:
  enabled: false
  samplingProbability: "0.1"
  otlpEndpoint: http://jaeger.monitoring.svc:4318/v1/traces
