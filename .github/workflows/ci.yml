name: CI

on:
  push:
    branches: [main, feat/advance-cloud-assignment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/library-app

jobs:
  test:
    name: Tests (unit + Testcontainers MySQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan every commit added since the baseline
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git --log-opts="baseline..HEAD" --redact --verbose .

  chart:
    name: Helm lint + manifest schema check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.0
      - name: Lint chart
        run: helm lint charts/library -f charts/library/values-local.yaml
      - name: Validate rendered manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template library charts/library -n library -f charts/library/values-local.yaml \
            | ./kubeconform -strict -summary -

  image:
    name: Build, scan, push image
    needs: [test, secret-scan, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compute short commit SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image (load locally so it can be scanned before pushing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
            APP_VERSION=0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy, fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" \
            aquasec/trivy:0.75.0 image --timeout 10m \
            --ignorefile /repo/.trivyignore.yaml \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress \
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha }}
  deploy:
    name: Release (update GitOps manifest)
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: local          # pauses here until a reviewer approves
    permissions:
      contents: write           # only this job may push to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Point the chart at the new image
        run: yq -i ".image.tag = \"sha-${GITHUB_SHA::7}\"" charts/library/values-local.yaml

      - name: Commit and push the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/library/values-local.yaml
          git commit -m "deploy: library-app sha-${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          git push origin HEAD:deploy/local